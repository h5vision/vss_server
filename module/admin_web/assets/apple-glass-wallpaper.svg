<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" role="img" aria-label="Abstract glass wallpaper">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dce8ff"/>
      <stop offset="0.34" stop-color="#b8caff"/>
      <stop offset="0.68" stop-color="#d9c6ff"/>
      <stop offset="1" stop-color="#ffd9e4"/>
    </linearGradient>
    <radialGradient id="orbA" cx="0.25" cy="0.28" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="0.32" stop-color="#a8d8ff" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#6c79ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0.7" cy="0.35" r="0.72">
      <stop offset="0" stop-color="#ffe7f5" stop-opacity="0.92"/>
      <stop offset="0.4" stop-color="#dcb9ff" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#9e7bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbonA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.84"/>
      <stop offset="0.42" stop-color="#9bd9ff" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#858cff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="ribbonB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8fb" stop-opacity="0.9"/>
      <stop offset="0.46" stop-color="#ffbfd9" stop-opacity="0.56"/>
      <stop offset="1" stop-color="#b59aff" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="blur80" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <filter id="blur34" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feBlend in="SourceGraphic" in2="b" mode="screen"/>
    </filter>
  </defs>
  <rect width="1920" height="1200" fill="url(#bg)"/>
  <ellipse cx="360" cy="330" rx="660" ry="530" fill="url(#orbA)" filter="url(#blur80)"/>
  <ellipse cx="1510" cy="360" rx="720" ry="560" fill="url(#orbB)" filter="url(#blur80)"/>
  <ellipse cx="1180" cy="1030" rx="760" ry="430" fill="#5fa4ff" fill-opacity="0.24" filter="url(#blur80)"/>
  <ellipse cx="520" cy="1020" rx="620" ry="390" fill="#ff86bf" fill-opacity="0.18" filter="url(#blur80)"/>
  <path d="M-210 890 C 240 390, 690 250, 1110 450 C 1370 575, 1580 545, 2130 180" fill="none" stroke="url(#ribbonA)" stroke-width="230" stroke-linecap="round" filter="url(#blur34)"/>
  <path d="M-120 210 C 410 585, 790 700, 1180 520 C 1490 375, 1700 425, 2060 770" fill="none" stroke="url(#ribbonB)" stroke-width="185" stroke-linecap="round" filter="url(#blur34)"/>
  <path d="M40 1150 C 420 730, 820 650, 1110 790 C 1435 945, 1655 900, 1940 610" fill="none" stroke="#ffffff" stroke-opacity="0.34" stroke-width="76" stroke-linecap="round" filter="url(#softGlow)"/>
  <circle cx="1510" cy="875" r="260" fill="#ffffff" fill-opacity="0.17" filter="url(#blur34)"/>
  <circle cx="250" cy="115" r="190" fill="#ffffff" fill-opacity="0.28" filter="url(#blur34)"/>
</svg>
